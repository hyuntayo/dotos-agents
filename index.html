    <style id="dotos-boot-style">
/* One neutral first paint hands off directly to the film, then the mascot scene. */
body{margin:0;background:#090b0f}
.dotos-early-loading{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#090b0f;color:#a8bad8;font:12px/1.5 Onest,Arial,sans-serif}
.dotos-early-loading>a{color:#a8bad8;text-underline-offset:5px;font-size:11px}
html[data-boot-scroll-lock],html[data-startup-stage=video]{overflow:hidden}
#dotos-intro-cover{display:none;position:fixed;inset:0;z-index:10001;background:#000;color:#dce5f4}
html[data-startup-stage=video] #dotos-intro-cover{display:block}
html[data-startup-stage=video] #root>:not(.welcome-guide){visibility:hidden}
#dotos-intro-cover>span{position:absolute;left:clamp(24px,4.5vw,76px);top:24px;font:800 28px/1 Manrope,Arial,sans-serif;letter-spacing:-1.4px}
#dotos-intro-cover>button{position:absolute;right:clamp(20px,4.5vw,76px);top:24px;min-height:44px;padding:8px 12px;border:0;background:transparent;color:#a4b8d9;font:12px Onest,Arial,sans-serif;cursor:pointer}
html[data-booting] #root{opacity:0;pointer-events:none}
html[data-boot-revealing] #root{opacity:1;transition:opacity .5s ease}
html[data-booting] .v-studio-mate[data-lead] .v-lead-model{opacity:0!important;pointer-events:none!important}
html[data-booting] .v-studio-mate[data-lead] .v-actor-render{opacity:1!important}
#dotos-boot{--boot-size:clamp(220px,30vw,390px);display:none;position:fixed;inset:0;z-index:10000;isolation:isolate;overflow:clip;color:#dce5f4}
html[data-booting] #dotos-boot{display:block}
.dotos-boot-backdrop{position:absolute;inset:0;z-index:-1;background:#090b0f}
.dotos-boot-header{position:absolute;inset:0 0 auto;padding:27px max(52px,calc((100vw - 1380px)/2));display:flex;justify-content:space-between;align-items:center;gap:30px}
.dotos-boot-wordmark{font:800 29px/1 Manrope,Arial,sans-serif;letter-spacing:-1.8px}
.dotos-boot-skip{display:flex;align-items:center;gap:21px;padding:11px 15px;background:none;border:1px solid #354760;border-radius:6px;color:#a4b8d9;font:10px/1 Onest,Arial,sans-serif;cursor:pointer}
.dotos-boot-skip:focus-visible{outline:2px solid #bad0f5;outline-offset:5px}
.dotos-boot-actor{position:fixed;left:50%;top:50%;width:var(--boot-size);aspect-ratio:450/520;translate:-50% -50%;transform-origin:50% 50%;pointer-events:none;will-change:transform}
.dotos-boot-mate{width:100%;height:100%;display:block;object-fit:contain;opacity:0;filter:drop-shadow(0 18px 25px #0003)}
#dotos-boot[data-image-ready] .dotos-boot-mate{opacity:1;animation:dotos-boot-jump 1.08s both}
.dotos-boot-fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font:700 44px/1 Manrope,Arial,sans-serif;letter-spacing:-2px}
#dotos-boot[data-image-failed] .dotos-boot-mate{display:none}
#dotos-boot[data-image-failed] .dotos-boot-fallback{display:flex}
.dotos-boot-shadow{position:fixed;left:50%;top:calc(50% + var(--boot-size) * .42);translate:-50% 0;width:calc(var(--boot-size) * .42);height:13px;border-radius:50%;background:#61799e23;filter:blur(10px);opacity:0;pointer-events:none}
#dotos-boot[data-image-ready] .dotos-boot-shadow{animation:dotos-boot-shadow 1.08s both}
.dotos-boot-caption{position:absolute;inset:auto 20px 13%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:17px}
.dotos-boot-caption>span:first-child{font:7px/1.6 'JetBrains Mono',monospace;letter-spacing:.1em;color:#647eaa}
.dotos-boot-caption>[data-boot-status]{font:12px/1.6 Onest,Arial,sans-serif;color:#a2b6d7}
.dotos-boot-track{height:1px;width:150px;background:#253750;overflow:hidden;margin-top:3px}
.dotos-boot-track>span{display:block;width:100%;height:100%;background:#adc3e9;transform:scaleX(0);transform-origin:0 50%;transition:transform .35s ease}
#dotos-boot[data-reduced] .dotos-boot-mate,#dotos-boot[data-reduced] .dotos-boot-shadow{animation:none;opacity:1}
#dotos-boot[data-reduced] .dotos-boot-track>span{transition:none}
@keyframes dotos-boot-jump{0%{transform:translate3d(-48vw,62vh,0) scale(.45) rotate(-24deg)}34%{transform:translate3d(-9vw,-23vh,0) scale(.91) rotate(10deg);animation-timing-function:cubic-bezier(.45,0,.9,.6)}64%{transform:translate3d(0,0,0) scale(1.13,.86) rotate(-4deg);animation-timing-function:cubic-bezier(.16,1,.3,1)}80%{transform:translate3d(0,-23px,0) scale(.96,1.045) rotate(1deg)}100%{transform:translate3d(0,0,0) scale(1) rotate(0deg)}}
@keyframes dotos-boot-shadow{0%,40%{opacity:0;transform:scale(.3)}64%{opacity:.95;transform:scale(1.25)}80%{opacity:.5;transform:scale(.85)}100%{opacity:.7;transform:scale(1)}}
@media(max-width:1200px){.dotos-boot-header{padding-inline:40px}}
@media(max-width:760px){.dotos-boot-header{padding:21px 20px}.dotos-boot-wordmark{font-size:25px}.dotos-boot-skip{font-size:9px;padding:10px 12px;gap:15px}.dotos-boot-caption{bottom:15%}}
@media(max-height:500px){#dotos-boot{--boot-size:150px}.dotos-boot-header{padding-block:17px}.dotos-boot-caption{bottom:24px;gap:9px}.dotos-boot-caption>span:first-child{display:none}.dotos-boot-track{margin-top:0}}
@media(prefers-reduced-motion:reduce){#dotos-boot .dotos-boot-mate,#dotos-boot .dotos-boot-shadow{animation:none!important;opacity:1}html[data-boot-revealing] #root{transition:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="dotos-early-loading" role="status"><span>Opening DotOS</span><a href="">Try again</a></div></div>
    <div id="dotos-intro-cover"><span>DotOS</span><button type="button" data-intro-skip aria-label="Skip intro">Skip intro</button></div>
    <div id="dotos-boot" data-phase="waiting" aria-label="Opening DotOS">
      <div class="dotos-boot-backdrop"></div>
      <header class="dotos-boot-header"><span class="dotos-boot-wordmark">DotOS</span><button type="button" class="dotos-boot-skip" data-boot-skip aria-label="Skip loading scene">Open site<svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10" stroke="currentColor" stroke-width="1.3"/></svg></button></header>
      <div class="dotos-boot-shadow" aria-hidden="true"></div>
      <div class="dotos-boot-actor" aria-hidden="true"><img class="dotos-boot-mate" src="/models/renders/hd-v1/blob-violet.webp" width="450" height="520" alt="" fetchpriority="high" decoding="async"/><span class="dotos-boot-fallback">DotOS</span></div>
      <div class="dotos-boot-caption"><span>A LITTLE HEAD START.</span><span role="status" data-boot-status>BOB is on his way.</span><span class="dotos-boot-track" aria-hidden="true"><span></span></span></div>
    </div>
    <script>
      (() => {
        const html = document.documentElement, root = document.getElementById('root'), boot = document.getElementById('dotos-boot'), cover = document.getElementById('dotos-intro-cover');
        if (html.dataset.startupStage !== 'video') { boot.remove(); cover.remove(); return; }
        let loadingTimer = 0;
        const cleanup = () => {
          clearTimeout(loadingTimer);
          document.removeEventListener('keydown', fallbackEscape);
          document.removeEventListener('dotos:intro-complete', startLoading);
          document.removeEventListener('dotos:startup-cancel', fallbackRelease);
          document.removeEventListener('dotos:boot-complete', cleanup);
        };
        const fallbackRelease = () => {
          html.dataset.startupStage = 'ready';
          html.removeAttribute('data-booting'); html.removeAttribute('data-boot-scroll-lock'); html.removeAttribute('data-intro-ready');
          root.inert = false; root.removeAttribute('aria-hidden'); root.removeAttribute('aria-busy'); boot.remove(); cover.remove(); cleanup();
        };
        const startLoading = () => {
          if (html.dataset.startupStage !== 'video') return;
          html.dataset.startupStage = 'loading'; html.removeAttribute('data-intro-ready'); cover.remove();
          html.setAttribute('data-booting', ''); html.setAttribute('data-boot-scroll-lock', '');
          boot.toggleAttribute('data-reduced', matchMedia('(prefers-reduced-motion: reduce)').matches);
          root.inert = true; root.setAttribute('aria-hidden', 'true'); root.setAttribute('aria-busy', 'true');
          document.dispatchEvent(new Event('dotos:boot-start'));
          loadingTimer = setTimeout(() => { if (boot.isConnected && !boot.hasAttribute('data-controlled')) fallbackRelease(); }, 7000);
        };
        const fallbackEscape = event => {
          if (event.key !== 'Escape') return;
          if (html.dataset.startupStage === 'video' && !html.hasAttribute('data-intro-ready')) { event.preventDefault(); startLoading(); }
          else if (html.dataset.startupStage === 'loading' && !boot.hasAttribute('data-controlled')) { event.preventDefault(); fallbackRelease(); }
        };
        cover.querySelector('[data-intro-skip]').addEventListener('click', startLoading);
        boot.querySelector('[data-boot-skip]').addEventListener('click', () => { if (!boot.hasAttribute('data-controlled')) fallbackRelease(); });
        document.addEventListener('keydown', fallbackEscape);
        document.addEventListener('dotos:intro-complete', startLoading);
        document.addEventListener('dotos:startup-cancel', fallbackRelease);
        document.addEventListener('dotos:boot-complete', cleanup);
        // A missing application may expose loading and its working escape path;
        // a playing or deliberately paused film is never cut off by this timer.
        setTimeout(() => { if (html.dataset.startupStage === 'video' && !html.hasAttribute('data-intro-ready')) startLoading(); }, 7000);
      })();
    </script>
    <script defer src="/boot/dotos-boot-v1.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
